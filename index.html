<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>CGS 1700 Midterm</title>
<style>
:root{--ink:#2d3b45;--mute:#6b7780;--line:#c7cdd1;--soft:#f5f5f5;--blue:#0b5cad;--amber:#8a5a00;--amberbg:#fff6e0;--code:#f1f3f5}
*{box-sizing:border-box}html{background:#fff}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;font-weight:600;margin:0 0 10px}h2{font-size:18px;font-weight:600;margin:20px 0 8px}
label.f{display:block;margin:10px 0;font-weight:600}label.f input{display:block;width:100%;max-width:420px;padding:8px;border:1px solid var(--line);border-radius:4px;font:inherit;margin-top:4px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:24px;align-items:start}
.side{position:sticky;top:12px;border:1px solid var(--line);border-radius:4px;padding:12px;font-size:14px}
.timer{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.dots a{display:block;text-align:center;font-size:12px;padding:2px 0;border:1px solid var(--line);border-radius:3px;color:var(--ink);text-decoration:none}
.dots a.done{background:var(--blue);border-color:var(--blue);color:#fff}
.q{border:1px solid var(--line);border-radius:4px;margin-bottom:16px;overflow:hidden}
.qh{display:flex;justify-content:space-between;gap:12px;background:var(--soft);border-bottom:1px solid var(--line);padding:8px 12px;font-weight:600;font-size:14px}
.qb{padding:12px}.qb p{margin:0 0 10px}
pre{background:var(--code);border:1px solid #dfe3e6;border-radius:3px;padding:10px;margin:0 0 12px;overflow-x:auto;font:12.5px/1.45 Consolas,"Cascadia Mono",Menlo,monospace;white-space:pre-wrap;word-break:break-word}
label.opt{display:flex;gap:10px;padding:8px;border-top:1px solid #eceef0;cursor:pointer;align-items:flex-start}
label.opt:first-of-type{border-top:0}label.opt input{margin-top:4px;flex:none}label.opt p{margin:0}
.note{border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 12px;border-radius:3px;margin:12px 0}
.note p{margin:0 0 6px}.pick{border-top:1px solid #eceef0;padding-top:8px;font-weight:600}.pick p{display:inline;margin:0;font-weight:400}.pick div{display:inline}.note.warn{border-left-color:var(--amber);background:var(--amberbg)}
@media print{.row,.note{display:none}body{color:#000}}
@media (max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}}
</style></head><body><div class="wrap" id="app"></div>
<script id="data" type="application/json">[{"key": "p1", "n": 1, "title": "Part 1: Multiple Choice", "minutes": 60, "items": [{"type": "mc", "points": 2.5, "html": "<p>A processor is starting the fetch stage of its instruction cycle. What does it do during the fetch stage?<\/p>", "choices": ["<p>It carries out the operation named by the instruction, such as adding two numbers<\/p>", "<p>It reads the next instruction from the memory address held in the program counter<\/p>", "<p>It copies the whole program from the disk into main memory<\/p>", "<p>It waits for an I/O module to raise an interrupt<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A server runs vmstat while a large file is being read from disk. The in column is interrupts per second, the first row is an average since boot, and si and so are swap-in and swap-out. In rows 2 and 3, in jumps from 310 to about 4,000. What best explains the jump?<\/p><pre><code>$ vmstat 1 3\nprocs -----------memory---------- ---swap-- -----io---- -system-- ------cpu-----\n r  b   swpd   free   buff  cache   si   so    bi    bo   in   cs us sy id wa st\n 1  0      0 812344  96412 2457760    0    0    52    21  310  612  4  2 93  1  0\n 0  1      0 804144  96412 2465940    0    0  8200     0 4125 6021  3  6 62 29  0\n 0  1      0 796200  96412 2473876    0    0  7936     8 3988 5834  2  5 64 29  0<\/code><\/pre>", "choices": ["<p>The program is executing many more instructions, and each instruction raises an interrupt<\/p>", "<p>The kernel is swapping memory pages out to disk because RAM is full<\/p>", "<p>The processor is polling the disk in a loop, and each poll is counted as an interrupt<\/p>", "<p>The disk controller raises an interrupt each time it finishes a transfer<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A program loops through a large array one element after another. Each time the processor misses in the cache, the hardware copies a whole block of nearby memory into the cache, so the next several reads are served very quickly. Which principle makes this speed-up work?<\/p>", "choices": ["<p>Locality of reference: the next accesses are likely near the last one<\/p>", "<p>Direct memory access, because the cache moves data into memory without the processor<\/p>", "<p>Time slicing, because the program gets the processor in short turns<\/p>", "<p>Interrupt priority, because the cache is serviced before slower devices<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A server must move 2 GB from a network card into main memory. Which I/O technique lets the I/O module transfer the data directly to memory, so the processor does not have to execute instructions for every word moved?<\/p>", "choices": ["<p>Programmed I/O, where the processor checks the device and moves every word itself<\/p>", "<p>Interrupt-driven I/O, where the processor still moves each word after every interrupt<\/p>", "<p>Direct memory access (DMA), where the I/O module moves the block itself<\/p>", "<p>Cache write-back, where modified cache lines are copied back to main memory later<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A text editor calls the operating system to save a file. While the OS code writes to the disk, the processor runs in kernel mode instead of user mode. Why is this switch needed?<\/p>", "choices": ["<p>Kernel mode makes the editor's own instructions run faster than user mode<\/p>", "<p>User mode cannot read the editor's variables, so the OS has to copy them<\/p>", "<p>Privileged instructions that control hardware run only in kernel mode<\/p>", "<p>Kernel mode creates a new process for each file that the editor saves<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Four programs on a laptop all want the processor, memory and the disk at the same time. The operating system decides who gets each resource and for how long. Which OS role is this?<\/p>", "choices": ["<p>Resource manager: it controls how the processor, memory and I/O devices are shared<\/p>", "<p>User interface: it hides the hardware behind commands and menus<\/p>", "<p>Application program: it performs a task the user asked for, such as editing text<\/p>", "<p>Boot loader: it copies the kernel into memory when the computer starts<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A single job runs alone and spends about 80 percent of its time waiting for slow disk I/O, so the processor sits idle about 80 percent of the time. How does multiprogramming raise processor utilization?<\/p>", "choices": ["<p>It speeds up the disk so that each job finishes its I/O sooner than before<\/p>", "<p>It lets a job skip its I/O requests whenever the processor would otherwise be idle<\/p>", "<p>It raises the clock speed of the processor while a job is waiting for the disk<\/p>", "<p>It switches the processor to another ready job whenever one job waits for I/O<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Stallings describes the Linux kernel as monolithic, with loadable modules. Which description matches a monolithic kernel?<\/p>", "choices": ["<p>Only a small core stays in kernel mode, and the file system and device drivers run as separate user-level processes<\/p>", "<p>Most OS services, such as scheduling, file systems and drivers, run together in kernel space as one big program<\/p>", "<p>The kernel runs entirely in user mode, so it can be replaced without a reboot<\/p>", "<p>Each application carries its own private copy of the kernel<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>You open three terminal windows and start the text editor nano in each one. The file /usr/bin/nano exists once on disk. How many programs and how many processes are involved?<\/p>", "choices": ["<p>Three programs and one process<\/p>", "<p>Three programs and three processes<\/p>", "<p>One program and three processes<\/p>", "<p>One program and one process shared by the three windows<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Using the PPID column, which process directly started the worker with PID 4136?<\/p><pre><code>$ ps -o pid,ppid,stat,comm\n  PID  PPID STAT COMMAND\n 3302  3290 Ss   bash\n 4121  3302 S    python3\n 4135  4121 S    worker\n 4136  4121 R    worker\n 4150  3302 R+   ps<\/code><\/pre>", "choices": ["<p>PID 4121 (python3)<\/p>", "<p>PID 3302 (bash)<\/p>", "<p>PID 3290, the process that started bash<\/p>", "<p>PID 4135, the other worker<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>An editor is open in a terminal and nobody is typing. Which description of this process is correct?<\/p><pre><code>$ ps -o pid,stat,pcpu,comm -p 5230\n  PID STAT %CPU COMMAND\n 5230 S+    0.0 nano<\/code><\/pre>", "choices": ["<p>Running: it is on the processor right now and is executing instructions<\/p>", "<p>Blocked: it waits for an event such as a keystroke, so it uses no CPU<\/p>", "<p>Ready: it could run immediately if the scheduler gave it the processor<\/p>", "<p>Exited: it has finished running but its parent has not collected it yet<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A runaway process named crunch ignored a plain kill, which sends SIGTERM, and is still using the CPU. Which command ends it without needing the program's cooperation?<\/p><pre><code>$ kill 8812\n$ ps -o pid,stat,pcpu,comm -p 8812\n  PID STAT %CPU COMMAND\n 8812 R    97.3 crunch<\/code><\/pre>", "choices": ["<p>kill -15 8812<\/p>", "<p>kill -HUP 8812<\/p>", "<p>kill -CONT 8812<\/p>", "<p>kill -9 8812<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>The child, PID 5120, shows state Z, and its parent, PID 5100, is asleep and has not called wait(). What is the correct way to make the zombie row disappear?<\/p><pre><code>$ ps -o pid,ppid,stat,comm -p 5100,5120\n  PID  PPID STAT COMMAND\n 5100  4890 S    app-parent\n 5120  5100 Z    app-child &lt;defunct&gt;<\/code><\/pre>", "choices": ["<p>Send kill -9 to PID 5120 repeatedly until the zombie finally dies<\/p>", "<p>Get the parent to collect the child's exit status with wait() or waitpid()<\/p>", "<p>Add more RAM, because the zombie is using most of the memory<\/p>", "<p>Lower the zombie's priority, because it is hogging the CPU<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>The process uploader (PID 7001) was started by a launcher script, PID 6990. After the launcher was terminated, uploader is still running. Why does its PPID now show 1?<\/p><pre><code>$ ps -o pid,ppid,stat,comm -p 7001\n  PID  PPID STAT COMMAND\n 7001  6990 S    uploader\n$ kill 6990\n$ ps -o pid,ppid,stat,comm -p 7001\n  PID  PPID STAT COMMAND\n 7001     1 S    uploader<\/code><\/pre>", "choices": ["<p>uploader became a zombie, and PID 1 is the process where all zombies are kept<\/p>", "<p>The kernel killed uploader, and PID 1 then started a brand new copy of it<\/p>", "<p>kill 6990 also changed the priority of every process the launcher had started<\/p>", "<p>uploader became an orphan, so the kernel gave it to PID 1, which adopts it<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Two processes have each run for one minute. Which conclusion is best supported by their context switch counters?<\/p><pre><code>$ grep ctxt /proc/6101/status\nvoluntary_ctxt_switches:  5231\nnonvoluntary_ctxt_switches:  12\n$ grep ctxt /proc/6107/status\nvoluntary_ctxt_switches:  41\nnonvoluntary_ctxt_switches:  18764<\/code><\/pre>", "choices": ["<p>PID 6107 is CPU-bound and gets preempted a lot, while PID 6101 often waits for I/O<\/p>", "<p>PID 6101 is CPU-bound, because its voluntary count is much higher than its nonvoluntary count<\/p>", "<p>Both are CPU-bound, because voluntary and nonvoluntary counts always add up to the same total<\/p>", "<p>PID 6107 is a zombie, because a process with few voluntary switches must be dead<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>The OS stops Process A in the middle of its program so that Process B can run, and later resumes A exactly where it left off. What must the OS save in A's process control block to make this possible?<\/p>", "choices": ["<p>Only its PID and name, because the program text is already in memory<\/p>", "<p>A copy of every open file and every byte the process wrote to disk<\/p>", "<p>Its saved registers, including the program counter, and its state<\/p>", "<p>The scheduler's list of all the other processes waiting to run<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>How many processes and how many threads does this output show?<\/p><pre><code>$ ps -L -o pid,lwp,nlwp,stat,comm -p 3150\n  PID   LWP NLWP STAT COMMAND\n 3150  3150    4 Sl   webapp\n 3150  3155    4 Sl   webapp\n 3150  3156    4 Sl   webapp\n 3150  3157    4 Sl   webapp<\/code><\/pre>", "choices": ["<p>One process with four threads<\/p>", "<p>Four processes with one thread each<\/p>", "<p>One process with three threads, because the first row is the process and not a thread<\/p>", "<p>Four processes that share a single thread<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A web server process runs three threads. The OS must be able to pause any one thread and later resume it without confusion. Which of these must each thread have its own copy of?<\/p>", "choices": ["<p>The global variables, which all of the threads read and write<\/p>", "<p>A stack and saved registers, including the program counter<\/p>", "<p>The table of open files that the process was given by the OS<\/p>", "<p>The program's machine code, which is loaded once from the executable file<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A browser team gives every tab its own process instead of its own thread. What is the main benefit of this design?<\/p>", "choices": ["<p>Switching between tabs is cheaper, because processes share one address space<\/p>", "<p>Tabs can read each other's variables directly, so sharing data is easier<\/p>", "<p>The browser uses less memory, because a process needs no stack or heap<\/p>", "<p>A crash or bug in one tab cannot overwrite the memory of the other tabs<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A program uses a thread library that creates user-level threads, and the kernel knows only about the process, not about the individual threads. One thread makes a plain blocking read() on a slow disk. What happens to the other threads in that process?<\/p>", "choices": ["<p>All of them block, since the kernel blocks the whole process<\/p>", "<p>They all keep running, because the kernel schedules each user-level thread on its own<\/p>", "<p>They keep running, but only on the other cores of the processor<\/p>", "<p>They are all terminated, because a blocked thread cannot be resumed<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A video program has 4 kernel-level threads and runs on a computer with 4 processor cores. What can the kernel do for this program that it could not do if the program used only user-level threads?<\/p>", "choices": ["<p>Let the four threads share the same address space<\/p>", "<p>Run the four threads on four different cores at the same time<\/p>", "<p>Give every thread its own private copy of the program's global data<\/p>", "<p>Switch between the threads with no cost at all<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Two threads belong to the same process. Thread 1 finishes writing the value 7 into the global variable status. Afterward, Thread 2 reads status. What does Thread 2 see?<\/p>", "choices": ["<p>The old value, because each thread keeps its own copy of the globals<\/p>", "<p>An error, because one thread cannot read memory written by another<\/p>", "<p>The value 7, because threads of one process share the same global data<\/p>", "<p>Zero, because the value is erased when the writing thread finishes<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>The same program, with no code changes, printed a different wrong total on each run. What is the most likely cause?<\/p><pre><code>$ for i in 1 2 3; do python3 tally.py; done\nexpected 200000, got 196428\nexpected 200000, got 197310\nexpected 200000, got 195872<\/code><\/pre>", "choices": ["<p>A deadlock: the workers wait on each other forever, so some of the additions never get performed<\/p>", "<p>A memory leak: each run loses a few bytes of memory, so the total shrinks<\/p>", "<p>A race condition: threads update the shared counter without a lock and lose updates<\/p>", "<p>A faulty processor that randomly skips some of the additions it was given<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Two customers must not both buy the last ticket. Which lines form the critical section that needs a lock?<\/p><pre><code>tickets = 1   # shared by every thread\n\ndef sell(customer):\n    global tickets\n    name = customer.upper()        # line 1\n    if tickets &gt; 0:                # line 2\n        tickets = tickets - 1      # line 3\n        return name + \" OK\"        # line 4\n    return name + \" SOLD OUT\"      # line 5<\/code><\/pre>", "choices": ["<p>Line 1 only, where the customer name is built<\/p>", "<p>Lines 4 and 5, where the result is returned<\/p>", "<p>Lines 1 and 2, the name and the check<\/p>", "<p>Lines 2 and 3, the check and the update of tickets<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Thread T7 asked to enter a critical section a minute ago. Every thread that arrived after T7 has been allowed in ahead of it, again and again, and T7 is still waiting. Only one thread is inside at any moment. Which requirement of a correct solution is violated?<\/p>", "choices": ["<p>Bounded waiting: no thread may be skipped forever<\/p>", "<p>Mutual exclusion: only one thread inside at a time<\/p>", "<p>Progress: an empty critical section must admit a waiting thread<\/p>", "<p>Atomicity: the lock must be set in one indivisible step<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A semaphore guards a pool of 4 database connections and starts at 4. Six threads each call wait() (P) before any thread calls signal() (V). What happens?<\/p>", "choices": ["<p>Two threads continue and the other four block until signal() is called<\/p>", "<p>Four threads continue and two block until some thread calls signal()<\/p>", "<p>All six block until some thread calls signal()<\/p>", "<p>All six continue, because a semaphore only counts and never blocks<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A programmer builds a lock in two steps: check whether the lock variable is 0, then set it to 1. Two threads can still both enter the critical section. How do hardware instructions such as test-and-set and compare-and-swap fix this?<\/p>", "choices": ["<p>They give each thread its own private copy of the lock variable to use<\/p>", "<p>They turn off the processor cache so every thread reads fresh values<\/p>", "<p>They check and set the lock in one step that no other thread can interrupt<\/p>", "<p>They make the critical section run so fast that the gap never matters<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A configuration table is read by 200 threads every second and updated by one writer thread once an hour. The goal is to let as many readers as possible work at the same time while keeping updates safe. Which locking approach fits best?<\/p>", "choices": ["<p>No lock at all, because reading never causes problems<\/p>", "<p>One ordinary mutex that every reader and the writer must hold, one at a time<\/p>", "<p>An exclusive lock for the readers and a shared lock for the writer<\/p>", "<p>A readers-writer lock: readers share it, and the writer takes it alone<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A batch system requires each job to request every resource it will need (tape drive, printer, scanner) in one request before it starts. If any resource is busy, the job waits while holding nothing. Which of the four necessary conditions for deadlock does this rule remove?<\/p>", "choices": ["<p>Mutual exclusion: a resource can have only one holder at a time<\/p>", "<p>No preemption: nobody can take a resource away from the job holding it<\/p>", "<p>Circular wait: the waiting jobs form a closed loop of requests<\/p>", "<p>Hold and wait: a job keeps some resources while asking for more<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Thread 1 locks the printer and then the scanner. Thread 2 locks the scanner and then the printer. Once, each got its first lock and both froze. Which change makes this deadlock impossible?<\/p>", "choices": ["<p>Require every thread to take the printer lock first and the scanner lock second<\/p>", "<p>Run Thread 2 at a lower priority than Thread 1<\/p>", "<p>Give the program more RAM so that both locks can be held at once<\/p>", "<p>Let each thread retry at once when it cannot get its second lock, without releasing the first<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A system has one copy of each resource. P1 holds R1 and waits for R2. P2 holds R2 and waits for R3. P3 holds R3 and is running normally, asking for nothing more. Is there a deadlock?<\/p>", "choices": ["<p>Yes, because P1 waits for P2 and P2 waits for P3, forming a circle<\/p>", "<p>Yes, because every process holds one resource<\/p>", "<p>No, because P3 can finish and release R3, then P2 can finish, then P1<\/p>", "<p>It cannot be decided without knowing how much CPU each process uses<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A database finds that Transaction 41 waits for a row held by Transaction 52, and Transaction 52 waits for a row held by Transaction 41. It cancels Transaction 52, rolls back its changes, and Transaction 41 continues. Which strategy is this?<\/p>", "choices": ["<p>Prevention, because it removed one of the four conditions in advance<\/p>", "<p>Detection and recovery: it found the circle and removed a victim<\/p>", "<p>Avoidance, because it checked each request with the banker's algorithm<\/p>", "<p>Ignoring the problem, because the transactions simply waited<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A system has 10 units of one resource type. Process A holds 4 units and may need up to 6 in total. Process B holds 3 units and may need up to 9 in total. 3 units are free. Which statement is correct?<\/p>", "choices": ["<p>The state is unsafe, because the maximum needs add up to 15 and only 10 units exist<\/p>", "<p>The state is safe, and the only safe order is B first, then A<\/p>", "<p>The state is safe: A can finish first, then B can finish<\/p>", "<p>The state is unsafe, because B's remaining need of 6 is larger than the 3 free units<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A code review finds that a program's locks are exclusive (one holder at a time), threads keep the locks they hold while asking for more, and no lock can be taken away from a thread. A teammate says, \"So this program will certainly deadlock.\" What is the best reply?<\/p>", "choices": ["<p>Correct, because those three conditions alone are enough to guarantee a deadlock<\/p>", "<p>Not certain, because deadlock also needs starvation first, which a timer can prevent<\/p>", "<p>Wrong, because exclusive locks can never be part of a deadlock<\/p>", "<p>Not certain: deadlock also needs circular wait, which a fixed lock order removes<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A monitoring alert says cachesvc is using 4.8 GB of memory on a server with 4 GB of RAM. The administrator runs this command (both columns are in kilobytes). Which statement is correct?<\/p><pre><code>$ ps -o pid,vsz,rss,comm -p 2488\n  PID     VSZ    RSS COMMAND\n 2488 4812344 212508 cachesvc<\/code><\/pre>", "choices": ["<p>About 212 MB is in RAM now, and the 4.8 GB is address space it has reserved<\/p>", "<p>It is using 4.8 GB of RAM, so the server is about to run out of memory<\/p>", "<p>It is using 4.8 GB plus 212 MB, split between RAM and the disk<\/p>", "<p>VSZ and RSS are the same measurement shown in two different units<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>The listing shows part of the memory map of a running process. Which region holds the program's machine instructions, and what does its permission string allow?<\/p><pre><code>$ grep -e cachesvc -e heap /proc/4410/maps\n55d0c2a00000-55d0c2a21000 r--p 00000000 08:01 1310725  /usr/bin/cachesvc\n55d0c2a21000-55d0c2a8e000 r-xp 00021000 08:01 1310725  /usr/bin/cachesvc\n55d0c2a8e000-55d0c2aa6000 r--p 0008e000 08:01 1310725  /usr/bin/cachesvc\n55d0c2aa6000-55d0c2aa7000 r--p 000a6000 08:01 1310725  /usr/bin/cachesvc\n55d0c2aa7000-55d0c2aaa000 rw-p 000a7000 08:01 1310725  /usr/bin/cachesvc\n55d0c3d7a000-55d0c3d9b000 rw-p 00000000 00:00 0  [heap]<\/code><\/pre>", "choices": ["<p>An r--p line: it may be read and executed but not written<\/p>", "<p>The r-xp line: it may be read and executed but not written<\/p>", "<p>The rw-p line for /usr/bin/cachesvc: it may be read, written and executed<\/p>", "<p>The [heap] line: it may be read and written but not executed<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>A system uses dynamic partitioning (variable-sized blocks). Free memory is five separate holes of 2 MB, 3 MB, 2 MB, 3 MB and 2 MB, which is 12 MB in total. A process asks for 6 MB and cannot be loaded. What is this problem called, and what could make the request succeed?<\/p>", "choices": ["<p>Internal fragmentation; switching to smaller fixed-size partitions for every process<\/p>", "<p>Internal fragmentation; compaction, which merges the wasted space<\/p>", "<p>A page fault; loading the missing page of the process from disk<\/p>", "<p>External fragmentation; compaction, which slides processes together<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>On this machine a process uses logical address 10000 (decimal). Paging splits an address into a page number and an offset, and pages are numbered from 0. Which pair is correct?<\/p><pre><code>$ getconf PAGESIZE\n4096<\/code><\/pre>", "choices": ["<p>Page 3, offset 1808<\/p>", "<p>Page 2, offset 1808<\/p>", "<p>Page 1808, offset 2<\/p>", "<p>Page 2, offset 44<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>The service cachesvc vanished, and nothing was written in its own log file. This line was found in the kernel log. What most likely happened?<\/p><pre><code>$ sudo journalctl -k | grep \"Killed process\"\nNov 03 03:12:44 lab-srv kernel: Out of memory: Killed process 2314 (cachesvc) total-vm:7340032kB, anon-rss:3145728kB, file-rss:0kB, shmem-rss:0kB, UID:1001 pgtables:6420kB oom_score_adj:0<\/code><\/pre>", "choices": ["<p>The kernel's out-of-memory killer ended it when the machine ran out of RAM<\/p>", "<p>It finished its work and exited normally with status 0<\/p>", "<p>It became a zombie and was removed when its parent called wait()<\/p>", "<p>Linux detected a deadlock in the program and stopped it<\/p>"]}, {"type": "mc", "points": 2.5, "html": "<p>Fifty processes on a server all use the same C library. The OS keeps a single copy of the library's code in RAM and maps it into all fifty. Which memory-management requirement is this?<\/p>", "choices": ["<p>Relocation: programs run wherever there is room<\/p>", "<p>Protection: processes cannot touch each other's memory<\/p>", "<p>Sharing: many processes use one copy of the same memory<\/p>", "<p>Physical organization: data moves between RAM and disk automatically<\/p>"]}]}, {"key": "p2", "n": 2, "title": "Part 2: Hands-on Lab", "minutes": 40, "items": [{"type": "text", "points": 0.0, "html": "<p>Part 2 is hands-on. Do this first, in CourseLabs:<\/p><p>1. Open courselabs.io, go to the Operating Systems course, and open the lab named OS Midterm Practice.<\/p><p>2. On the first page of the lab, click the prepare block and wait for the word ready.<\/p><p>3. Click the name block, replace YOUR NAME HERE with your real name, keep the quotation marks, and press Enter.<\/p><p>4. Type source ~/.bashrc and press Enter. Your name must now show in the prompt.<\/p><p>5. Use the top terminal for everything. Ignore the rest of the lab's pages.<\/p><p>Each task below gives you a command. Copy it, click in the top terminal, paste with Ctrl + Shift + V (Cmd + V on a Mac), press Enter, and wait for it to finish. Then answer the question from what your terminal shows. Keep this page and the lab tab both open.<\/p>"}, {"type": "mc", "points": 6.0, "html": "<p>TASK 1, processes. Run this command and wait for the output (about 3 seconds). What does the STAT column tell you about the child process?<\/p><pre><code>echo \"=== TASK 1 ===\" | tee -a ~/midterm.txt; (sleep 1 &amp; exec sleep 12) &amp; sleep 3; ps -o pid,ppid,stat,comm --ppid $! | tee -a ~/midterm.txt<\/code><\/pre>", "choices": ["<p>It is running on a processor right now<\/p>", "<p>It is a zombie: it has finished, and its parent has not collected its exit status<\/p>", "<p>It is stopped, and it is waiting for a CONT signal<\/p>", "<p>It is blocked, and it is waiting for keyboard input<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 2, threads. This program starts 5 threads and then waits. Run the command. What number does it print, and why?<\/p><pre><code>echo \"=== TASK 2 ===\" | tee -a ~/midterm.txt; python3 -c \"import threading,time; [threading.Thread(target=time.sleep,args=(10,),daemon=True).start() for _ in range(5)]; time.sleep(10)\" &amp; sleep 2; ls /proc/$!/task | wc -l | tee -a ~/midterm.txt<\/code><\/pre>", "choices": ["<p>1, because /proc lists only the process and not its threads<\/p>", "<p>5, one entry for each thread the program started<\/p>", "<p>6, the 5 new threads plus the main thread<\/p>", "<p>10, because every thread is counted twice<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 3, mutual exclusion. Three workers each add 1 to a shared file 200 times, so the correct total is 600. Run command 1 and wait for it to finish, then run command 2 and wait for it to finish (up to about 20 seconds each). What explains your two totals?<\/p><pre><code># command 1\npkill -x flock; echo \"=== TASK 3 ===\" | tee -a ~/midterm.txt; echo 0 &gt; /tmp/m; for w in 1 2 3; do ( for i in $(seq 1 200); do n=$(cat /tmp/m); echo $((n+1)) &gt; /tmp/m; done ) &amp; done; wait; echo \"no lock: $(cat /tmp/m)\" | tee -a ~/midterm.txt\n\n# command 2\npkill -x flock; echo 0 &gt; /tmp/m; for w in 1 2 3; do ( for i in $(seq 1 200); do flock /tmp/m.lock -c 'n=$(cat /tmp/m); echo $((n+1)) &gt; /tmp/m'; done ) &amp; done; wait; echo \"with lock: $(cat /tmp/m)\" | tee -a ~/midterm.txt<\/code><\/pre>", "choices": ["<p>The lock makes the read, add and write one critical section, so with the lock the total is exactly 600 and no updates are lost<\/p>", "<p>Both totals are 600, because three workers can never run at the same time<\/p>", "<p>The total with no lock is higher, because the lock slows the workers down<\/p>", "<p>The total with the lock is lower, because flock throws away updates<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 4, deadlock. Two processes each take one lock, wait, then ask for the other lock. Run the command (about 7 seconds). It counts the lock requests that are waiting, then kills the flock processes. What did you just create?<\/p><pre><code>pkill -x flock; echo \"=== TASK 4 ===\" | tee -a ~/midterm.txt; touch /tmp/P /tmp/Q; flock /tmp/P -c 'sleep 5; flock /tmp/Q -c true' &amp; flock /tmp/Q -c 'sleep 5; flock /tmp/P -c true' &amp; sleep 7; echo \"waiting lines: $(grep -c -- '-&gt;' /proc/locks)\" | tee -a ~/midterm.txt; pkill -x flock<\/code><\/pre>", "choices": ["<p>A race condition that fixes itself after a few seconds<\/p>", "<p>A memory leak, because each lock uses more memory while it waits<\/p>", "<p>A slow disk, because both processes are waiting for /tmp<\/p>", "<p>A deadlock: each process holds one lock and waits for the other, and something outside had to end it<\/p>"]}, {"type": "mc", "points": 6.0, "html": "<p>TASK 5, memory. Both programs map 400 MB. The first never touches it. The second writes to all of it. Run command 1, then command 2 (about 5 seconds each). VSZ stays about the same, but RSS jumps by about 400,000 KB. Why?<\/p><pre><code># command 1\necho \"=== TASK 5 ===\" | tee -a ~/midterm.txt; python3 -c \"import mmap,time; m=mmap.mmap(-1,400*1024*1024); time.sleep(5)\" &amp; sleep 2; ps -o vsz,rss,comm -p $! | tee -a ~/midterm.txt\n\n# command 2\npython3 -c \"import mmap,time; m=mmap.mmap(-1,400*1024*1024); [m.write(b'x'*1048576) for _ in range(400)]; time.sleep(5)\" &amp; sleep 3; ps -o vsz,rss,comm -p $! | tee -a ~/midterm.txt<\/code><\/pre>", "choices": ["<p>The second program reserved 400 MB more address space than the first<\/p>", "<p>RSS counts disk space, so the file grew on the disk<\/p>", "<p>The first program only reserved address space, and RAM is used only once pages are touched<\/p>", "<p>The kernel moved the first program's memory out to swap<\/p>"]}, {"type": "file", "points": 20.0, "html": "<p>FINAL STEP. Run this command in the top terminal. It prints your whole record. If the top of the output is cut off, drag the divider between the two terminals down and run it again. Take one screenshot showing the Machine line, all five tasks, and your name in the prompt, then upload it to Canvas with your Part 2 answer file. Without your name in the prompt, this question scores 0.<\/p><pre><code>clear; echo \"Machine $(cat /proc/sys/kernel/hostname)  $(date -u +%H:%M) UTC\"; cat ~/midterm.txt<\/code><\/pre>"}]}]</script>
<script>
const Q=JSON.parse(document.getElementById('data').textContent),KEY='cgs1700-midterm',L='ABCD';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const rich=h=>{const d=el('div');d.innerHTML=h;return d};
const app=document.getElementById('app');let tick=null;
let S={first:'',last:'',email:'',view:'home',p1:{ans:{},order:{},end:0,done:0},p2:{ans:{},order:{},end:0,done:0}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function shuffle(q){const s=S[q.key];q.items.forEach((it,i)=>{if(it.type==='mc'&&!s.order[i]){const o=[0,1,2,3];for(let j=3;j>0;j--){const k=Math.floor(Math.random()*(j+1));[o[j],o[k]]=[o[k],o[j]]}s.order[i]=o}})}
function render(){clearInterval(tick);app.textContent='';scrollTo(0,0);if(S.view==='home')return home();const q=Q.find(x=>x.key===S.view);if(S[q.key].done)return finish(q);take(q)}
function home(){app.append(el('h1','','CGS 1700 Midterm'),el('p','','Chapters 1 to 7, 150 points. Keep your camera on in Zoom. Your score stays hidden until your instructors release it.'),el('p','','Part 1 is 40 multiple choice questions, 100 points, 60 minutes. Part 2 is 5 tasks in a live CourseLabs terminal plus one screenshot, 50 points, 40 minutes. There is no essay and nothing to type out, you pick an answer for every question.'));
const fld=(t,v,ty,ph)=>{const l=el('label','f',t),i=el('input');i.value=v;if(ty)i.type=ty;if(ph)i.placeholder=ph;l.append(i);app.append(l);return i};const fi=fld('First name',S.first),la=fld('Last name',S.last),mi=fld('School email',S.email,'email','you@mymdc.net');const w=el('div','note warn');w.hidden=true;app.append(w);
const r=el('div','row');Q.forEach(q=>{const b=el('button','btn',S[q.key].done?q.title+' (submitted)':'Start '+q.title);b.onclick=()=>{const f=fi.value.trim(),a=la.value.trim(),e=mi.value.trim();if(!f||!a||!/^\S+@\S+\.\S+$/.test(e)){w.textContent='Enter your first name, last name and school email first.';w.hidden=false;return}S.first=f;S.last=a;S.email=e;const s=S[q.key];if(!s.end)s.end=Date.now()+q.minutes*60000;shuffle(q);S.view=q.key;save();render()};r.append(b)});app.append(r,el('p','','Start each part only when your instructor says so. The clock starts when you click.'))}
function take(q){const s=S[q.key];app.append(el('h1','',q.title),el('p','',S.first+' '+S.last+', '+S.email),el('div','note','')); app.lastChild.append(el('p','',q.n===1?'Pick the best answer for each of the 40 questions. Each is worth 2.5 points. You can go back and change an answer until you click Submit at the bottom.':'Follow the instructions first. For each task, run the command in the lab, then pick the answer that matches what your terminal shows. Each task is worth 6 points. The final step is a screenshot worth 20 points.'));const lay=el('div','layout'),main=el('div'),side=el('div','side');let n=0;
q.items.forEach((it,i)=>{const c=el('div','q');c.id='q'+i;const h=el('div','qh'),b=el('div','qb');b.append(rich(it.html));if(it.type==='text'){h.append(el('span','','Instructions'));c.append(h,b);main.append(c);return}
n++;h.append(el('span','','Question '+n),el('span','',it.points+' pts'));if(it.type==='mc')s.order[i].forEach(o=>{const l=el('label','opt'),r=el('input');r.type='radio';r.name=q.key+i;r.checked=s.ans[i]===o;r.onchange=()=>{s.ans[i]=o;save();dots()};l.append(r,rich(it.choices[o]));b.append(l)});c.append(h,b);main.append(c)});
const st=el('button','btn','Submit '+q.title);st.onclick=()=>{const miss=q.items.filter((it,i)=>it.type==='mc'&&s.ans[i]===undefined).length;const o=document.getElementById('cf');if(o)o.remove();const f=()=>{s.done=Date.now();save();render()};const c=el('div','note warn');c.id='cf';c.append(el('p','',(miss?miss+' question(s) have no answer. ':'')+'Once you submit, you cannot change your answers.'));const b=el('button','btn','Yes, submit');b.onclick=f;c.append(b);main.append(c);c.scrollIntoView({block:'center'})};main.append(st);
const t=el('div','timer');side.append(el('div','','Time left:'),t);const dbox=el('div','dots');side.append(dbox);
function dots(){dbox.textContent='';let m=0;q.items.forEach((it,i)=>{if(it.type!=='mc')return;m++;const a=el('a',s.ans[i]!==undefined?'done':'',m);a.href='#q'+i;dbox.append(a)})}
const show=()=>{const left=Math.max(0,Math.round((s.end-Date.now())/1000));t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left){s.done=Date.now();save();render()}};show();dots();tick=setInterval(show,1000);lay.append(main,side);app.append(lay)}
function finish(q){const s=S[q.key],a=[];let n=0;q.items.forEach((it,i)=>{if(it.type==='mc'){n++;a.push(n+(s.ans[i]===undefined?'-':L[s.ans[i]]))}});
const lines=['CGS 1700 Midterm Part '+q.n,'First name: '+S.first,'Last name: '+S.last,'Email: '+S.email,'Part: '+q.n,'Started: '+new Date(s.end-q.minutes*60000).toLocaleString(),'Finished: '+new Date(s.done).toLocaleString(),'Answers: '+a.join(' ')],body=lines.join('\r\n'),fname='Midterm-Part'+q.n+'-'+(S.last+'-'+S.first).replace(/[^A-Za-z0-9-]+/g,'')+'.txt';
app.append(el('h1','',q.title+': one step left'));const w=el('div','note warn');w.append(el('p','','This part is NOT turned in yet. Download your file, then upload it to the Midterm assignment in Canvas.'));if(q.n===2)w.append(el('p','','Upload your terminal screenshot to the same assignment.'));app.append(w);
const r=el('div','row'),dl=el('button','btn','Download my answers');dl.onclick=()=>{const u=URL.createObjectURL(new Blob([body],{type:'text/plain'})),x=el('a');x.href=u;x.download=fname;document.body.append(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);dl.textContent='Downloaded: '+fname};const p=el('button','btn alt','Print or save as PDF');p.onclick=()=>print();r.append(dl,p);app.append(r);
app.append(el('pre','',body),el('h2','','Your submitted answers (locked)'));let k=0;q.items.forEach((it,i)=>{if(it.type!=='mc')return;k++;const c=el('div','q'),h=el('div','qh'),bd=el('div','qb'),pk=el('div','pick');h.append(el('span','','Question '+k));bd.append(rich(it.html));pk.append('Your answer: ');if(s.ans[i]===undefined)pk.append('No answer');else pk.append(rich(it.choices[s.ans[i]]));bd.append(pk);c.append(h,bd);app.append(c)});const b=el('button','btn alt','Back to the start');b.onclick=()=>{S.view='home';save();render()};const r2=el('div','row');r2.append(b);app.append(r2,el('p','','You will not see a score today.'))}
render();
</script></body></html>
